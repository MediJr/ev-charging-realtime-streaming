# Plateforme de supervision temps réel, en une commande :  docker compose up -d --build
#   redpanda        journal d'événements (API Kafka)            127.0.0.1:19092
#   console         interface des topics Kafka                  http://127.0.0.1:8080
#   lake            stockage S3 du lakehouse (SeaweedFS)        127.0.0.1:8333
#   postgres        catalogue Iceberg + base de diffusion       127.0.0.1:5435
#   spark           traitement Spark Structured Streaming       http://127.0.0.1:4040 (interface Spark)
#   simulator       200 bornes simulées
#   co2-collector   intensité carbone RTE (temps réel)
#   grafana         supervision                                 http://127.0.0.1:3001
# Identifiants lus dans .env (jamais versionné, voir .env.example). Mémoire bornée par service : le tout tient sous 5 Go.

x-app: &app
  build: { context: ., dockerfile: docker/app.Dockerfile }
  image: lumio-app:1.0.0
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP: redpanda:9092
    SIM_CHARGERS: ${SIM_CHARGERS:-200}
    SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-5}
    SIM_SEED: ${SIM_SEED:-42}
  depends_on:
    topics: { condition: service_completed_successfully }

services:
  redpanda:
    image: redpandadata/redpanda:v25.3.18
    container_name: lumio-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode dev-container          # un seul nœud, réglages de développement
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 1500m

  # Conteneur éphémère : crée les topics avec leur nombre de partitions et leur rétention, puis s'arrête.
  topics:
    image: redpandadata/redpanda:v25.3.18
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        R="rpk --brokers redpanda:9092"
        # 6 partitions : la clé charger_id répartit les bornes, l'ordre reste garanti pour une même borne
        $$R topic create charger.telemetry -p 6 -c retention.ms=604800000 || true
        $$R topic create charger.alerts -p 3 || true
        $$R topic create sim.injections -p 1 || true
        # Topic compacté : on ne garde que la dernière valeur de chaque créneau RTE
        $$R topic create grid.co2 -p 1 -c cleanup.policy=compact || true
        $$R topic list

  console:
    image: redpandadata/console:v3.13.1
    container_name: lumio-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda: { condition: service_healthy }
    mem_limit: 256m

  lake:
    image: chrislusf/seaweedfs:4.48
    container_name: lumio-lake
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Fichier d'identités S3 généré au démarrage à partir de .env : aucun secret dans le dépôt (même choix qu'au projet 3).
    entrypoint: >
      /bin/sh -c '
      printf "{\"identities\":[{\"name\":\"spark\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
      exec /entrypoint.sh server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
      '
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - lake-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 512m

  postgres:
    image: postgres:17-alpine
    container_name: lumio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "127.0.0.1:5435:5432"           # 5433 et 5434 sont pris par les projets 1 et 2
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 512m

  spark:
    build: { context: ., dockerfile: docker/spark.Dockerfile }
    image: lumio-spark:1.0.0
    container_name: lumio-spark
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      POSTGRES_HOST: postgres
      S3_ENDPOINT: http://lake:8333
      TZ: UTC
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - spark-checkpoints:/checkpoints      # points de reprise : un redémarrage reprend exactement où il s'était arrêté
    depends_on:
      topics: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      lake: { condition: service_healthy }
    mem_limit: 2500m

  simulator:
    <<: *app
    container_name: lumio-simulator
    command: ["python", "-m", "lumio_stream.simulator"]
    mem_limit: 256m

  co2-collector:
    <<: *app
    container_name: lumio-co2
    command: ["python", "-m", "lumio_stream.co2_collector"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: lumio-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # écran du centre d'exploitation : lecture seule, sans connexion
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lumio.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 384m

volumes:
  redpanda-data:
  lake-data:
  pg-data:
  spark-checkpoints:
